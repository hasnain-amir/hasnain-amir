<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Hasnain Amir — software developer</title>
  <desc id="desc">Dark navy editorial banner with the name Hasnain Amir, focus areas in full-stack, backend and embedded systems, and a diagram representing interfaces, services and hardware.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111C30"/>
      <stop offset=".58" stop-color="#0C1424"/>
      <stop offset="1" stop-color="#111B32"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58D8C5"/>
      <stop offset="1" stop-color="#879AFF"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#2B5D6E" stop-opacity=".45"/>
      <stop offset="1" stop-color="#2B5D6E" stop-opacity="0"/>
